<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagenes\faviconFormulario.png">

    <!-- Favicon -->
    <link rel="shortcut icon" href="./aset/Imgs/logo-favicon/favicon_io/favicon-16x16.png" type="image/x-icon">

    <title>Formulario de Contacto</title>

    <link rel="stylesheet" href="aset/css/contacto.css">
    <link rel="stylesheet" href="aset/css/bases.css">
    <link rel="stylesheet" href="aset/css/header.css">
    <link rel="stylesheet" href="aset/css/footer.css">

</head>

<body>
    <header id="header" class="header">

    </header>
    <main>
        <div class="formularioCont">
            <form onsubmit="return validar()" id="miFormulario">

                <h2 class="tituloFormulario"> Contacto</h2>

                <label for="nombre">Nombre Completo: <span id="nombreError" class="error"></span></label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre completo">

                <label for="apellido">Apellido <span id="apellidoError" class="error"></span></label>
                <input type="text" id="apellido" placeholder="Ingresa tu apellido...">

                <label for="email">Correo electronico: <span id="emailError" class="error"></span></label>
                <input type="text" id="email" placeholder="xxxxxx@gmail.com">

                <label for="celular">Numero Celular: <span id="celularError" class="error"></span></label>
                <input type="number" id="celular" placeholder="2664XXXXXX">

                <label for="pregunta">Pregunta y/o consulta: </label>
                <textarea id="pregunta" name="pregunta" maxlength="300"></textarea>

                <button type="submit" id="botonEnviar">Enviar</button>

            </form>
            <div id="mensajes">

            </div>

        </div>


    </main>

    <footer id="footer" class="footer">

    </footer>
    <script src="./aset/js/contacto.js"></script>
    <script src="./aset/js/header-footer.js"></script>

</body>

</html>
